services:
  backend:
    build:
      context: ./backend
    container_name: steffi-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-https://steffmetz.appswifts.com/api}
    container_name: steffi-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
